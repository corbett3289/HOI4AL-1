l_english:
 coi_alien_news.report.a: "File the report under the highest classification."
 coi_alien_news.option.xac: "The Consensus records their reaction."
 coi_alien_news.option.origin: "The secret has crossed our borders."
 coi_alien_news.option.secretive: "Contain what can still be contained."
 coi_alien_news.option.human: "The world is changing."

 coi_alien_news.1.t: "The RS/33 Custody Brief"
 coi_alien_news.1.desc: "A sealed memorandum has arrived from the remnants of the Gabinetto RS/33. It describes the recovery near Magenta in 1933 not as an aircraft accident, but as the capture of a vehicle whose structure, controls, and biological traces correspond to no known nation. The damaged craft remains under armed custody in Lombardy. A parallel ecclesiastical archive was created to contain the implications. Officially, none of this exists."
 coi_alien_news.2.t: "The Correlated Pattern"
 coi_alien_news.2.desc: "The impossible reports are no longer isolated. Radar tracks, pilot testimony, astronomical observations, and naval logs describe the same accelerations and the same abrupt silences. Analysts have eliminated weather, mechanical failure, and every known foreign design. Whatever crosses our skies is operating according to a consistent purpose."
 coi_alien_news.3.t: "A Directorate Without a Name"
 coi_alien_news.3.desc: "Authority over the anomalous files has been removed from ordinary ministries. Cleared officers, physicists, physicians, and intelligence specialists will work through compartments that conceal even the existence of the program from one another. Its budget has no public line, its facilities have no signs, and its directorate has no official name."
 coi_alien_news.4.t: "Luminous Escorts Over the Front"
 coi_alien_news.4.desc: "Combat aircrews report brilliant spheres pacing their formations through cloud, flak, and evasive turns. The lights neither attack nor answer recognition signals, and they vanish at speeds no aircraft could survive. Enemy activity has been ruled out. Flight logs and gun-camera film have been seized before the crews can compare stories."
 coi_alien_news.5.t: "The Northern Rocket File"
 coi_alien_news.5.desc: "Observers across the northern seas describe silent rocket-shaped objects descending through cloud and turning against the wind. Search parties recover scorched water, disturbed reeds, and instruments briefly rendered useless, but no conventional debris. The reports have been gathered into a restricted file and separated from ordinary air-defense traffic."
 coi_alien_news.6.t: "New Mexico, 1947"
 coi_alien_news.6.desc: "Military teams have secured a debris field in New Mexico after local witnesses reported a violent light in the night sky. The recovered material is exceptionally light, resists cutting and heat, and returns to its original shape after deformation. No intact vehicle or crew has been found. Public statements will describe an ordinary airborne instrument while the fragments enter classified custody."
 coi_alien_news.7.t: "The Capital Radar Siege"
 coi_alien_news.7.desc: "For several nights, radar stations surrounding the capital have tracked formations entering restricted airspace, stopping without loss of altitude, and departing beyond interception speed. Pilots confirm lights where the scopes place them. Orders now require every plot, photograph, and radio transcript to be routed directly to the special directorate."
 coi_alien_news.8.t: "The Returned Witness"
 coi_alien_news.8.desc: "A citizen missing for several hours has been found disoriented far from the place of disappearance. Medical examination reveals geometric tissue damage, unusual sedation, and memories that collapse under questioning into images of pale figures and a room without visible walls. The witness has been isolated, but family and local authorities already know something occurred."
 coi_alien_news.9.t: "A Reporter Has the Flight Logs"
 coi_alien_news.9.desc: "An investigative reporter has obtained copies of restricted flight logs whose redactions do not conceal the repeated phrases: impossible acceleration, luminous escort, no conventional return. Security officers can close one avenue of publication, but the reporter has prepared duplicates and spoken with several aircrews. The Black Archive is becoming a story of its own."
 coi_alien_news.10.t: "The Photographs Cannot Be Recalled"
 coi_alien_news.10.desc: "Clear photographs from a restricted incident have escaped official custody. Independent laboratories authenticate the film stock, exposure, and camera, while witnesses identify the location and date. Confiscation would now confirm what denial cannot erase. Copies are moving through newspapers, broadcasters, and foreign intelligence services."
 coi_alien_news.11.t: "Contact Contingencies Approved"
 coi_alien_news.11.desc: "The government has approved sealed plans for an event no public doctrine acknowledges: mass sightings, an unintelligible transmission, biological contamination, or the arrival of a superior force. Continuity sites, scientific teams, and command channels will be prepared quietly. No official may use the word 'extraterrestrial' outside the compartment."

 coi_alien_news.100.t: "Lights Pace the Bombers"
 coi_alien_news.100.desc: "Aircrews returning from combat describe brilliant spheres that flew beside their aircraft, matched every maneuver, and vanished without attacking. Censors call them reflections, secret weapons, or exhausted imagination. The same accounts are nevertheless appearing on opposing fronts, leaving officials unable to explain whose weapon the lights could be."
 coi_alien_news.101.t: "The Northern Rocket Scare"
 coi_alien_news.101.desc: "Reports of silent, rocket-shaped objects have spread across the northern skies. Witnesses describe impossible turns and descents into lakes without recoverable wreckage. Governments blame meteors and postwar nerves, but military search parties and classified conferences suggest that the phenomenon is being taken seriously."
 coi_alien_news.102.t: "Flying Disc Fever"
 coi_alien_news.102.desc: "Newspapers are filled with accounts of shining discs, strange debris, and contradictory military statements. A brief announcement concerning recovered material in New Mexico was withdrawn and replaced with a mundane explanation, deepening public suspicion. Authorities dismiss the excitement as rumor even as witnesses insist that something fell from the sky."
 coi_alien_news.103.t: "A Capital Watches the Sky"
 coi_alien_news.103.desc: "Unidentified lights have crossed restricted airspace above a national capital on consecutive nights. Radar operators and interceptor crews corroborate one another, yet no aircraft has been brought down or identified. Crowds now gather after dark while officials offer incompatible explanations and air-defense commands remain on alert."

 coi_alien_news.104.t: "Scientists Demand the Records"
 coi_alien_news.104.desc.radio: "A group of prominent scientists has used the press and radio to demand access to official records of unidentified aerial phenomena. They argue that censorship is obstructing legitimate study and that the consistency of military and civilian reports can no longer be dismissed."
 coi_alien_news.104.desc.broadcast: "In a widely carried television appearance, prominent scientists have demanded the release of official records concerning unidentified craft. They accuse governments of substituting ridicule for investigation and call for an international scientific review."
 coi_alien_news.104.desc.digital: "An open letter signed by leading scientists has spread across global networks, demanding machine-readable access to government records of unidentified craft. Independent analysts are already correlating leaked sensor data faster than officials can remove it."

 coi_alien_news.105.t: "[event_target:coi_alien_news_origin.GetNameDefCap] Opens an Aerial Inquiry"
 coi_alien_news.105.desc.radio: "The government of [event_target:coi_alien_news_origin.GetNameDef] has announced a formal inquiry into unusual aerial reports. Radio officials stress that no extraordinary conclusion has been reached, but the public acknowledgment marks a sharp departure from years of ridicule and denial."
 coi_alien_news.105.desc.broadcast: "[event_target:coi_alien_news_origin.GetNameDefCap] has established a public commission to investigate unidentified craft. Televised testimony from pilots and radar operators has transformed a fringe subject into a question of national security."
 coi_alien_news.105.desc.digital: "[event_target:coi_alien_news_origin.GetNameDefCap] has opened a public, data-driven inquiry into unidentified craft. Sensor records will be released in stages, though critics say the most important military files remain outside the commission's reach."

 coi_alien_news.106.t: "Whistleblower Alleges a Hidden Recovery Program"
 coi_alien_news.106.desc.radio: "A reporter in [event_target:coi_alien_news_origin.GetNameDef] claims that military authorities have concealed unusual flight records and recovered material inside an unacknowledged program. Officials deny the allegation, but several named witnesses have confirmed parts of the account by telephone and radio."
 coi_alien_news.106.desc.broadcast: "A former official from [event_target:coi_alien_news_origin.GetNameDef] has described a hidden recovery program in a televised interview. Documents shown during the broadcast refer to unknown vehicles, biological precautions, and compartments beyond normal legislative oversight."
 coi_alien_news.106.desc.digital: "A large archive attributed to a whistleblower in [event_target:coi_alien_news_origin.GetNameDef] has appeared across global networks. Cryptographic signatures and independent witnesses support parts of the collection, while government efforts to suppress mirrors have only accelerated its spread."

 coi_alien_news.107.t: "Authenticated Film Reaches the Public"
 coi_alien_news.107.desc.radio: "Still frames published in [event_target:coi_alien_news_origin.GetNameDef] show a seamless craft performing an abrupt maneuver above a military installation. Independent photographers authenticate the negatives and exposure. Radio commentators now ask why the film spent years inside a classified archive."
 coi_alien_news.107.desc.broadcast: "Broadcast networks have aired authenticated footage from [event_target:coi_alien_news_origin.GetNameDef] showing a craft accelerating without wings, exhaust, or a visible control surface. Frame-by-frame analysis has failed to reveal a conventional aircraft or photographic trick."
 coi_alien_news.107.desc.digital: "Authenticated multisensor footage from [event_target:coi_alien_news_origin.GetNameDef] is being replicated across every major network. The visible craft matches radar and infrared tracks, leaving official spokespeople to dispute interpretation rather than authenticity."

 coi_alien_news.108.t: "[event_target:coi_alien_news_origin.GetNameDefCap] Acknowledges Non-Human Technology"
 coi_alien_news.108.desc.radio: "In an extraordinary address carried by radio and newsreel, [event_target:coi_alien_news_origin.GetNameDef] has acknowledged possession of evidence produced by no known human power. The statement stops short of describing its origin, but confirms that decades of official denials were false."
 coi_alien_news.108.desc.broadcast: "The government of [event_target:coi_alien_news_origin.GetNameDef] has told a live television audience that some recovered technology is not of human manufacture. Officials promise controlled scientific disclosure while refusing to discuss bodies, communications, or operational craft."
 coi_alien_news.108.desc.digital: "[event_target:coi_alien_news_origin.GetNameDefCap] has issued a synchronized global statement confirming non-human technology. Supporting sensor data and material analysis were released at once, making retraction or quiet reinterpretation impossible."

 coi_alien_news.109.t: "[event_target:coi_alien_news_origin.GetNameDefCap] Opens the Files"
 coi_alien_news.109.desc.radio: "[event_target:coi_alien_news_origin.GetNameDefCap] has ordered its secret aerial archives opened to the press. Crates of reports, photographs, and laboratory notes reveal a long campaign of investigation and denial. Foreign governments are under immediate pressure to disclose what they know."
 coi_alien_news.109.desc.broadcast: "Television crews in [event_target:coi_alien_news_origin.GetNameDef] have been admitted to repositories holding decades of classified material on non-human craft. The scale of the archive has turned disclosure from a national controversy into an international crisis of trust."
 coi_alien_news.109.desc.digital: "[event_target:coi_alien_news_origin.GetNameDefCap] has released its complete extraterrestrial archive to public networks. Millions of pages, sensor records, and material scans are being copied worldwide, ending any realistic possibility of renewed secrecy."

 coi_alien_news.110.t: "The International Contact Council Revealed"
 coi_alien_news.110.desc.radio: "[event_target:coi_alien_news_origin.GetNameDefCap] has confirmed the existence of a secret international council created to exchange anomalous evidence and prepare for contact. The disclosure reveals that rival governments cooperated privately while denying the phenomenon to their own populations."
 coi_alien_news.110.desc.broadcast: "A televised statement from [event_target:coi_alien_news_origin.GetNameDef] has exposed an International Contact Council operating beyond ordinary alliance politics. Member governments now face demands to publish their shared evidence and emergency plans."
 coi_alien_news.110.desc.digital: "Documents released by [event_target:coi_alien_news_origin.GetNameDef] confirm a compartmented International Contact Council linking research and defense networks across ideological blocs. Its encrypted evidence ledger is already leaking into public circulation."

 coi_alien_news.111.t: "Wreckage Before the Cameras"
 coi_alien_news.111.desc.radio: "A crippled, seamless craft has fallen in public view inside [event_target:coi_alien_news_origin.GetNameDef]. Reporters reached the perimeter before military cordons closed, and photographs of the wreckage have crossed international wire services. No weather balloon, secret aircraft, or official denial can contain what was seen."
 coi_alien_news.111.desc.broadcast: "Live cameras in [event_target:coi_alien_news_origin.GetNameDef] have recorded the crash of a vehicle unlike any human aircraft. Emergency crews move around an unbroken metallic hull as armed forces struggle to push crowds and broadcasters back from the site."
 coi_alien_news.111.desc.digital: "Thousands of independent recordings show a non-human craft descending over [event_target:coi_alien_news_origin.GetNameDef] and striking the ground. Sensor data, close-range images, and live streams have been replicated globally. Catastrophic disclosure is now irreversible."

 coi_alien_news.112.t: "The Vatican Opens the Reliquary"
 coi_alien_news.112.desc.radio: "Church authorities have opened a sealed reliquary containing biological remains and records linked to the Magenta recovery. In a radio address, the Vatican declares that the existence of other intelligent life does not diminish humanity's spiritual worth, while admitting that the evidence was hidden for generations."
 coi_alien_news.112.desc.broadcast: "Before an international television audience, the Vatican has displayed preserved non-human remains and the secret records of their custody. The announcement combines theological reinterpretation with an extraordinary confession of institutional secrecy."
 coi_alien_news.112.desc.digital: "The Vatican has released complete scans, custody records, and biological analysis from its hidden Magenta reliquary. Religious authorities call for calm and theological humility as authenticated data spreads through scientific networks worldwide."

 coi_alien_news.113.t: "They Have Chosen to Be Seen"
 coi_alien_news.113.desc.radio: "Enormous craft have descended in deliberate formation above [event_target:coi_alien_news_origin.GetNameDef], remaining motionless as radio frequencies collapse into a repeating signal. This is no accident and no failed concealment. Whoever commands the vessels has selected a place and chosen to be witnessed."
 coi_alien_news.113.desc.broadcast: "Live broadcasts from [event_target:coi_alien_news_origin.GetNameDef] show impossible vessels holding position above the landfall zone. Their arrival is measured, coordinated, and plainly intentional. Humanity is no longer observing the phenomenon from a distance; the phenomenon is addressing humanity."
 coi_alien_news.113.desc.digital: "Every civilian and military sensor near [event_target:coi_alien_news_origin.GetNameDef] records the same impossible formation. The descending craft broadcast a structured carrier across all networks and wait above the designated landfall. Concealment has ended by alien choice."

 coi_alien_news.114.t: "A Voice Without a Nation"
 coi_alien_news.114.desc.radio: "Every major radio band has carried the same measured sequence, spoken in languages chosen for each listener. The voice identifies itself only as the Consensus. It denies any connection to a human nation and promises that a judgment concerning humanity will follow."
 coi_alien_news.114.desc.broadcast: "Television and radio services across the world have been interrupted by a calm, synchronized transmission. The speakers call themselves the Consensus. No transmitter can be located, and every translation conveys the same closing statement: humanity is under evaluation."
 coi_alien_news.114.desc.digital: "The transmission appeared simultaneously on military networks, civilian devices, and isolated systems with no external connection. A synthetic voice naming the Consensus addresses each recipient in a familiar language and announces that humanity's political order has been assessed."

 coi_alien_news.115.t: "The Consensus Passes Judgment"
 coi_alien_news.115.desc.federation: "The Consensus declares that humanity's harshest regimes prove a capacity for discipline twisted by fear and false hierarchy. Their rulers will be removed, their subjects freed, and every willing population prepared for accession to a galactic federation. The promise of liberation arrives backed by overwhelming force."
 coi_alien_news.115.desc.annihilation: "The Consensus describes humanity's democratic plurality as a system that industrializes conflict while distributing responsibility until no one can stop it. Earth has been judged an expansion risk. Unless the assessment changes, the civilization that produced this order will be extinguished."
 coi_alien_news.115.desc.sovereignty: "The Consensus finds in humanity's communist plurality both a demand for equality and a machinery capable of erasing the individual. It therefore proclaims every conscious mind sovereign. States, parties, and collective authorities that violate that sovereignty will be dismantled."
 coi_alien_news.115.desc.mandate: "The Consensus judges humanity's patchwork of non-aligned states incapable of surviving contact as separate claimants. National sovereignty is declared provisional. Earth will be reorganized under a single planetary mandate, whether its governments consent or not."

 coi_alien_news.116.t: "Generals Demand a Unified Extraterrestrial Defense Command"
 coi_alien_news.116.desc.radio: "Senior officers and scientists from several powers have called for a unified command to confront the extraterrestrial crisis. Their proposal would pool radar tracks, recovered technology, specialist personnel, and rapid-response forces under an organization answerable to humanity rather than any one alliance."
 coi_alien_news.116.desc.broadcast: "In coordinated televised statements, military and scientific leaders have demanded a permanent extraterrestrial defense command. The proposed organization would cross ideological blocs, investigate alien activity, and direct humanity's response to threats no country can face alone."
 coi_alien_news.116.desc.digital: "Defense chiefs, researchers, and intelligence directors have published a joint framework for a unified extraterrestrial command. Shared sensor networks and multinational response teams would operate continuously under a single mandate. Across public networks, one abbreviated name is already taking hold: XCOM."
