l_english:
 coi_alien_sp_exotic_materials_characterization: "Exotic Materials Characterization"
 coi_alien_sp_exotic_materials_characterization_desc: "Catalog the recovered fragments atom by atom, then determine why a substance that should buckle, melt, or fracture instead redistributes every imposed force. The program will establish principles, not a production-ready weapon."
 coi_alien_sp_field_propulsion_reconstruction: "Field Propulsion Reconstruction"
 coi_alien_sp_field_propulsion_reconstruction_desc: "With a substantially intact craft and a working model of its metamaterials, an air-research team can reconstruct the field geometry that isolates the vehicle from ordinary inertia. Success will provide theoretical foundations for propulsion, sensing, and directed-energy programs—not a flyable copy."

 coi_alien_human_exotic_materials: "Human Exotic-Materials Theory"
 coi_alien_human_exotic_materials_desc: "A classified working theory for alien metamaterials, stored outside the ordinary research tree and granted only by the Exotic Materials Characterization project."
 coi_alien_human_field_dynamics: "Human Field-Dynamics Theory"
 coi_alien_human_field_dynamics_desc: "A classified mathematical framework for alien field propulsion and its later sensor and energy applications, stored outside the ordinary research tree."

 coi_alien_sp_exotic_materials_output_tt: "Establish §YHuman Exotic-Materials Theory§!, permanently mark the materials program complete, and gain §G+10%§! speed for later §YAlien Reverse-Engineering Projects§!. No combat equipment is unlocked."
 coi_alien_sp_field_propulsion_output_tt: "Establish §YHuman Field-Dynamics Theory§!, permanently mark the propulsion program complete, gain a further §G+5%§! speed for §YAlien Reverse-Engineering Projects§!, and create unlock hooks for future §Ypropulsion§!, §Ysensors§!, and §Yenergy§! research. No combat equipment is unlocked."

 coi_alien_sp_requires_special_access_tt: "Requires an active §YSpecial Access Program§!"
 coi_alien_sp_requires_fragments_tt: "Requires permanent evidence: §YExotic Fragments§!"
 coi_alien_sp_requires_damaged_craft_tt: "Requires permanent evidence: §YRecovered Damaged Craft§!"
 coi_alien_sp_requires_exotic_materials_tt: "Requires completed §YExotic Materials Characterization§!"
 coi_alien_sp_requires_land_facility_tt: "Requires an owned §YLand Warfare Facility§!"
 coi_alien_sp_requires_air_facility_tt: "Requires an owned §YAeronautical and Avionics Facility§!"

 coi_alien_sp_reward_exotic_materials_assay: "The Sample Defies the Saw"
 coi_alien_sp_reward_exotic_materials_assay_desc: "Every cutting method changes the material's local structure before contact. The team must choose between patient observation and a destructive high-energy assay."
 coi_alien_sp_reward_exotic_materials_preserve: "Preserve the lattice and refine our method."
 coi_alien_sp_reward_exotic_materials_section: "Section it under maximum load."
 coi_alien_sp_reward_field_resonance: "A Resonance Beyond Inertia"
 coi_alien_sp_reward_field_resonance_desc: "The reconstructed field briefly decouples its test mass from the laboratory frame. We can isolate the phenomenon or increase the load before the geometry collapses."
 coi_alien_sp_reward_field_resonance_isolate: "Isolate the resonance and train the team."
 coi_alien_sp_reward_field_resonance_increase_load: "Increase the field load while it holds."

