l_english:
 coi_alien_catalog_impossible_tt: "Classified knowledge advances to §YCorrelated Pattern§!."
 coi_alien_establish_sap_tt: "Classified knowledge advances to §RClassified Confirmation§! and establishes a persistent §YSpecial Access Program§!."

 coi_alien_begin_quiet_monitoring: "Begin Quiet Monitoring"
 coi_alien_begin_quiet_monitoring_desc: "Place a handful of radar stations, observatories, and military commands on a sealed distribution list. Nothing is admitted and nothing is yet mobilized."
 coi_alien_draft_contact_contingencies: "Draft Contact Contingencies"
 coi_alien_draft_contact_contingencies_desc: "Prepare continuity plans for communication failure, mass sightings, exotic contamination, and a hostile presence without naming their actual cause."
 coi_alien_preparedness_quiet_monitoring_tt: "Preparedness advances to §YQuiet Monitoring§!."
 coi_alien_preparedness_contingency_tt: "Preparedness advances to §YContingency Planning§!."
 coi_alien_preparedness_national_mobilization_tt: "Preparedness advances to §ONational Mobilization§!."

 coi_alien_choose_black_archive: "The Black Archive"
 coi_alien_choose_black_archive_desc: "No institution survives by volunteering its most destabilizing truth. Seal the evidence, accelerate the hidden program, and deny every report. The archive will work faster, but every artifact and witness increases leak pressure."
 coi_alien_choose_black_archive_tt: "Adopt §YThe Black Archive§!. Alien special projects gain §G+10%§! speed. Routine incidents are easier to suppress, while unresolved evidence accumulates §RLeak Pressure§!."
 coi_alien_choose_prepared_public: "A Prepared Public"
 coi_alien_choose_prepared_public_desc: "Disclosure need not be a detonation. Over six months, normalize the vocabulary, release defensible fragments, and prepare the public for an official acknowledgment."
 coi_alien_choose_prepared_public_tt: "Begin a §Y180-day managed disclosure§!: Rumors after 60 days, Credible Controversy after 120, and Official Acknowledgment with National Mobilization after 180."
 coi_alien_choose_world_must_know: "The World Must Know Together"
 coi_alien_choose_world_must_know_desc: "No country can master this alone. Establish or join a compartmented international council that exists outside faction politics and exchanges evidence, researchers, and contingency planning."
 coi_alien_choose_world_must_know_tt: "Join the §YInternational Contact Council§!. Members share alien evidence and preparedness without joining or changing factions, and receive research support."
 coi_alien_choose_open_files: "Open the Files"
 coi_alien_choose_open_files_desc: "Publish the photographs, radar logs, testimony, and classified conclusions before another institution can bury them. The scandal will be immediate; the truth will no longer belong to governments."
 coi_alien_choose_open_files_tt: "Spend §Y100 Political Power§!, lose §R15% Stability§!, reach §YOfficial Acknowledgment§!, and seed Rumors and Anomalous Reports throughout the world."

 coi_alien_pivot_to_black_archive: "Return the Question to the Black Archive"
 coi_alien_pivot_to_black_archive_desc: "Re-compartmentalize the program and end active disclosure. This is impossible once the public has received an official acknowledgment."
 coi_alien_pivot_to_prepared_public: "Begin a Managed Disclosure"
 coi_alien_pivot_to_prepared_public_desc: "Abandon the current policy and begin preparing the public in three deliberate stages."
 coi_alien_pivot_to_world_must_know: "Enter the International Contact Council"
 coi_alien_pivot_to_world_must_know_desc: "Abandon unilateral policy and pool evidence and preparations with any country willing to enter the compartment."
 coi_alien_pivot_to_open_files: "Release Everything"
 coi_alien_pivot_to_open_files_desc: "End the present policy with a total public release. The political cost of the pivot comes before the scandal caused by the files themselves."
 coi_alien_disclosure_pivot_cost_tt: "Changing disclosure policy costs §Y100 Political Power§! and §R5% Stability§!. Policy cannot be changed again for §Y180 days§!."
 coi_alien_pivot_open_files_tt: "Changing policy costs §Y100 Political Power§! and §R5% Stability§!. Opening the files then costs an additional §R15% Stability§! and spreads the story worldwide."

 coi_alien_suppress_routine_leaks: "Spoil the Paper Trail"
 coi_alien_suppress_routine_leaks_desc: "Reclassify flight records, discredit inconvenient witnesses, and flood public channels with mutually exclusive explanations. Facts already accepted by the public cannot be erased."
 coi_alien_suppress_routine_leaks_tt: "Reduce §RLeak Pressure§! by §G10§! and suppress routine publicity for §Y90 days§!. Public Awareness will not decrease."

 coi_alien_disclosure_black_archive: "The Black Archive"
 coi_alien_disclosure_black_archive_desc: "A state within the state catalogs impossible artifacts and testimony under layers of denial. Its isolation accelerates alien special projects while pressure builds outside the vault."
 coi_alien_disclosure_prepared_public: "A Prepared Public"
 coi_alien_disclosure_prepared_public_desc: "Scientific institutions and civil authorities are quietly laying the social foundation for a truth that cannot remain classified forever."
 coi_alien_disclosure_international_council: "International Contact Council"
 coi_alien_disclosure_international_council_desc: "A faction-independent compact exchanges evidence, project support, and contingency plans among cleared governments."
 coi_alien_disclosure_open_files: "The Files Are Open"
 coi_alien_disclosure_open_files_desc: "The government has surrendered its monopoly on the extraterrestrial question. The immediate scandal has created a durable political constituency for investigation."

 coi_alien_discovery.1.t: "Returns Without Aircraft"
 coi_alien_discovery.1.desc: "Multiple stations have recorded objects crossing controlled airspace at speeds no known aircraft can sustain. The tracks vanish when challenged, leaving synchronized records and a room of officers unwilling to sign their names. The report has been entered into a classified anomaly ledger."
 coi_alien_discovery.1.a: "Catalog it with the others."
 coi_alien_discovery.10.t: "Rumors by Design"
 coi_alien_discovery.10.desc: "Carefully selected testimony has reached journalists and scientific societies. Officials deny specifics while encouraging sober discussion of unexplained aerial phenomena. The subject is no longer unthinkable, but it remains safely deniable."
 coi_alien_discovery.10.a: "Let the vocabulary take root."
 coi_alien_discovery.11.t: "The Evidence Becomes Credible"
 coi_alien_discovery.11.desc: "Authenticated instrument records and controlled witness statements have moved the issue beyond pulp headlines. Parliamentary questions, academic panels, and military contingency exercises now proceed in parallel."
 coi_alien_discovery.11.a: "Prepare them for the conclusion."
 coi_alien_discovery.12.t: "Official Acknowledgment"
 coi_alien_discovery.12.desc: "The government has acknowledged that a non-human technological presence is the best explanation for the accumulated evidence. Years of preparation have not eliminated fear, but institutions and the public now possess a common language for what comes next."
 coi_alien_discovery.12.a: "We face the sky with open eyes."
