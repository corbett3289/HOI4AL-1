l_english:
 coi_alien_branch_quiet_chorus: "Quiet Chorus"
 coi_alien_science: "Consensus Sciences"

 coi_alien_token_surface_profile: "Surface Profile"
 coi_alien_token_surface_profile_desc: "A passive model of the target's communications, security rhythms, and public systems. This access is never consumed."
 coi_alien_token_institutional_access: "Institutional Access"
 coi_alien_token_institutional_access_desc: "Mimetic identities and machine credentials embedded inside the target's civil institutions. Deep actions may consume this access."
 coi_alien_token_research_access: "Research Access"
 coi_alien_token_research_access_desc: "A live route into the target's restricted laboratories, archives, and special-project apparatus. Research actions consume this access."

 coi_alien_upgrade_mimetic_interface_lab: "Mimetic Interface Lab"
 coi_alien_upgrade_mimetic_interface_lab_desc: "A controlled environment for reproducing human documents, voices, protocols, and institutional behavior without revealing their inhuman origin."
 coi_alien_upgrade_cognitive_translation_matrix: "Cognitive Translation Matrix"
 coi_alien_upgrade_cognitive_translation_matrix_desc: "The matrix interprets human scientific language as a product of culture, fear, and incomplete models, making restricted research intelligible to the Chorus."
 coi_alien_upgrade_distributed_drone_cells: "Distributed Drone Cells"
 coi_alien_upgrade_distributed_drone_cells_desc: "Autonomous drone cells operate behind independent covers, allowing the Quiet Chorus to sustain dangerous missions without exposing a single central network."
 coi_alien_requires_survey_data_1_tt: "Requires at least §Y1 Survey Data§!"
 coi_alien_requires_survey_data_3_tt: "Requires at least §Y3 Survey Data§!"
 coi_alien_requires_survey_data_5_tt: "Requires at least §Y5 Survey Data§!"

 coi_alien_silent_systems_survey: "Silent Systems Survey"
 coi_alien_silent_systems_survey_desc: "Observe [FROM.GetNameDef]'s systems from beyond the edge of ordinary detection and assemble a durable surface profile."
 coi_alien_silent_systems_survey_outcome_tt: "Gain §YSurface Profile§! against [FROM.GetNameDef] and §Y1 Survey Data§!. There is a §R20%§! chance that the target gains §Y1 Awareness§!."

 coi_alien_seed_mimetic_access: "Seed Mimetic Access"
 coi_alien_seed_mimetic_access_desc: "Insert synthetic identities and impeccable machine records into [FROM.GetNameDef]'s institutions until our presence appears older than the officials who verify it."
 coi_alien_seed_mimetic_access_outcome_tt: "Gain §YInstitutional Access§! against [FROM.GetNameDef]. §YSurface Profile§! persists. There is a §R25%§! chance that the target gains §Y1 Awareness§!."

 coi_alien_penetrate_research_networks: "Penetrate Research Networks"
 coi_alien_penetrate_research_networks_desc: "Trace the human chain of clearances, laboratories, couriers, and private machines that surrounds [FROM.GetNameDef]'s protected research."
 coi_alien_penetrate_research_networks_outcome_tt: "Gain §YResearch Access§! against [FROM.GetNameDef] and §Y1 Survey Data§!. Existing lower-tier access persists. There is a §R35%§! chance that the target gains §Y1 Awareness§!."

 coi_alien_spoil_the_evidence: "Spoil the Evidence"
 coi_alien_spoil_the_evidence_desc: "Replace coherent evidence with plausible mistakes, compromised witnesses, and mutually exclusive explanations before suspicion becomes certainty."
 coi_alien_spoil_the_evidence_outcome_tt: "Consume §YInstitutional Access§! and any §YResearch Access§! against [FROM.GetNameDef]. Their investigations are disrupted for §Y180 days§!. There is a §R20%§! chance that the target gains §Y1 Awareness§!."

 coi_alien_introduce_cascading_faults: "Introduce Cascading Faults"
 coi_alien_introduce_cascading_faults_desc: "Seed harmless-looking defects across a selected logistics system, then trigger them together so human investigators find only a chain of ordinary failures."
 coi_alien_introduce_cascading_faults_outcome_tt: "Consume §YInstitutional Access§! and any §YResearch Access§!. Damage §Y1 Infrastructure§! and, when present, one §YRadar Station, Air Base, or Naval Base§! in the selected state. [FROM.GetNameDef] suffers reduced supply throughput and repair speed for §Y90 days§! and gains §Y1 Awareness§!."

 coi_alien_harvest_project_archives: "Harvest Project Archives"
 coi_alien_harvest_project_archives_desc: "Mirror [FROM.GetNameDef]'s project archives, translate the useful fragments, and leave every human checksum intact."
 coi_alien_harvest_project_archives_outcome_tt: "Consume §YResearch Access§!, gain §Y2 Survey Data§!, and receive one §G100%§! research bonus for §YAlien Science§!. A superior outcome also grants §G10%§! breakthrough progress in a random special-project specialization."
 coi_alien_harvest_project_archives_tech_bonus: "Harvested Project Archives"

 coi_alien_disrupt_research_complex: "Disrupt Research Complex"
 coi_alien_disrupt_research_complex_desc: "Turn a selected special-project facility's safeguards against it and incapacitate the scientist most capable of restoring the work."
 coi_alien_disrupt_research_complex_outcome_tt: "Consume §YInstitutional Access§! and §YResearch Access§!. Damage the selected §YSpecial Project Facility§!, slow its repair, and injure an eligible scientist for at least §Y45 days§!. [FROM.GetNameDef] gains §Y1 Awareness§!."

 coi_alien_extract_lead_scientist: "Extract Lead Scientist"
 coi_alien_extract_lead_scientist_desc: "Remove an active scientist from a selected special-project facility and carry the subject beyond every border human authorities know how to watch."
 coi_alien_extract_lead_scientist_outcome_tt: "Consume §YInstitutional Access§! and §YResearch Access§!, remove an eligible active scientist from [FROM.GetNameDef], and begin a disposition event aboard the Pale Horizon. The target gains §Y1 Awareness§!, with a §R25%§! chance of an additional point, and cannot be targeted by another extraction for §Y730 days§!."

 coi_alien_cascading_faults: "Cascading Faults"
 coi_alien_cascading_faults_desc: "Interdependent infrastructure defects are overwhelming diagnosis teams and diverting repair crews faster than replacement parts can arrive."

 coi_alien_phase_silent_systems_survey_calibrate: "Calibrate the Listening Veil"
 coi_alien_phase_silent_systems_survey_calibrate_desc: "Tune passive arrays to the target's civilian and military emissions without returning an identifiable signal."
 coi_alien_phase_silent_systems_survey_calibrate_outcome: "The listening veil separated useful traffic from the planet's electromagnetic noise."
 coi_alien_phase_silent_systems_survey_observe: "Observe the Human Rhythm"
 coi_alien_phase_silent_systems_survey_observe_desc: "Map routines, authentication cycles, emergency procedures, and the humans trusted to interrupt them."
 coi_alien_phase_silent_systems_survey_observe_outcome: "The target's public systems resolved into predictable cycles."
 coi_alien_phase_silent_systems_survey_withdraw: "Withdraw Without Echo"
 coi_alien_phase_silent_systems_survey_withdraw_desc: "Collapse temporary relays and erase the small anomalies their presence produced."
 coi_alien_phase_silent_systems_survey_withdraw_outcome: "The survey ended without leaving a coherent signature."
 coi_alien_phase_silent_systems_survey_withdraw_risk: "A transient signal survived the withdrawal and drew human attention."

 coi_alien_phase_seed_mimetic_access_model: "Model the Institution"
 coi_alien_phase_seed_mimetic_access_model_desc: "Reconstruct the target institution's language, hierarchy, document habits, and tolerated errors."
 coi_alien_phase_seed_mimetic_access_model_outcome: "The institution's unwritten rules were reduced to a usable model."
 coi_alien_phase_seed_mimetic_access_insert: "Insert the First Identity"
 coi_alien_phase_seed_mimetic_access_insert_desc: "Place a synthetic employee inside old records, current systems, and the memories produced by routine paperwork."
 coi_alien_phase_seed_mimetic_access_insert_outcome: "The mimetic identity passed its first independent verification."
 coi_alien_phase_seed_mimetic_access_stabilize: "Stabilize the Cover"
 coi_alien_phase_seed_mimetic_access_stabilize_desc: "Let human bureaucracy reproduce and defend the false identity without further intervention."
 coi_alien_phase_seed_mimetic_access_stabilize_outcome: "Human systems began preserving the cover on our behalf."
 coi_alien_phase_seed_mimetic_access_stabilize_risk: "A verification request exposed an inconsistency before the cell could close it."

 coi_alien_phase_penetrate_research_networks_map: "Map the Clearance Chain"
 coi_alien_phase_penetrate_research_networks_map_desc: "Identify which clearances grant real access and which exist only to reassure administrators."
 coi_alien_phase_penetrate_research_networks_map_outcome: "The true clearance chain emerged from the official fiction."
 coi_alien_phase_penetrate_research_networks_mirror: "Mirror Restricted Traffic"
 coi_alien_phase_penetrate_research_networks_mirror_desc: "Copy protected research traffic through a relay indistinguishable from ordinary network hardware."
 coi_alien_phase_penetrate_research_networks_mirror_outcome: "Restricted traffic reached the Chorus in a form ready for translation."
 coi_alien_phase_penetrate_research_networks_bury: "Bury the Route"
 coi_alien_phase_penetrate_research_networks_bury_desc: "Distribute the access route across trusted human machines so no single compromise reveals it."
 coi_alien_phase_penetrate_research_networks_bury_outcome: "The route disappeared inside the target's own trusted architecture."
 coi_alien_phase_penetrate_research_networks_bury_risk: "A defensive system isolated one relay before its final record could be erased."

 coi_alien_phase_spoil_the_evidence_identify: "Identify the Dangerous Pattern"
 coi_alien_phase_spoil_the_evidence_identify_desc: "Find the evidence most likely to connect separate anomalies into one inhuman explanation."
 coi_alien_phase_spoil_the_evidence_identify_outcome: "The investigation's decisive links were isolated."
 coi_alien_phase_spoil_the_evidence_replace: "Replace Certainty with Noise"
 coi_alien_phase_spoil_the_evidence_replace_desc: "Substitute plausible terrestrial causes, corrupted samples, and witnesses whose accounts cannot agree."
 coi_alien_phase_spoil_the_evidence_replace_outcome: "Every strong conclusion acquired a credible contradiction."
 coi_alien_phase_spoil_the_evidence_redirect: "Redirect the Investigators"
 coi_alien_phase_spoil_the_evidence_redirect_desc: "Guide human investigators toward a culprit their institutions already understand."
 coi_alien_phase_spoil_the_evidence_redirect_outcome: "The investigation turned inward and abandoned its most dangerous theory."
 coi_alien_phase_spoil_the_evidence_redirect_risk: "An investigator noticed that the new explanation arrived too perfectly."

 coi_alien_phase_introduce_cascading_faults_reconnoiter: "Reconnoiter the Failure Chain"
 coi_alien_phase_introduce_cascading_faults_reconnoiter_desc: "Model how one local defect can force overloaded systems to pass failure into the next."
 coi_alien_phase_introduce_cascading_faults_reconnoiter_outcome: "A failure chain was found that human maintenance doctrine would amplify."
 coi_alien_phase_introduce_cascading_faults_seed: "Seed Dormant Defects"
 coi_alien_phase_introduce_cascading_faults_seed_desc: "Place microscopic faults in infrastructure and base systems while each still appears serviceable."
 coi_alien_phase_introduce_cascading_faults_seed_outcome: "The defects passed inspection as unrelated wear."
 coi_alien_phase_introduce_cascading_faults_trigger: "Trigger the Cascade"
 coi_alien_phase_introduce_cascading_faults_trigger_desc: "Activate every defect in the sequence and withdraw before emergency crews understand the pattern."
 coi_alien_phase_introduce_cascading_faults_trigger_outcome: "Ordinary failures combined into an extraordinary systems collapse."
 coi_alien_phase_introduce_cascading_faults_trigger_risk: "A drone cell was observed near the first failure point as the cascade began."

 coi_alien_phase_harvest_project_archives_classify: "Classify the Human Archive"
 coi_alien_phase_harvest_project_archives_classify_desc: "Separate useful experimental records from institutional repetition, dead ends, and political reporting."
 coi_alien_phase_harvest_project_archives_classify_outcome: "The archive's useful knowledge was identified before any bulk transfer."
 coi_alien_phase_harvest_project_archives_copy: "Copy Between Checksums"
 coi_alien_phase_harvest_project_archives_copy_desc: "Mirror protected files while presenting every expected checksum to human monitors."
 coi_alien_phase_harvest_project_archives_copy_outcome: "The archive was copied without changing its human-facing state."
 coi_alien_phase_harvest_project_archives_sanitize: "Sanitize the Translation Trail"
 coi_alien_phase_harvest_project_archives_sanitize_desc: "Erase translation artifacts and dismantle the route that carried the archive off-world."
 coi_alien_phase_harvest_project_archives_sanitize_outcome: "Only ordinary access records remained after the harvest."
 coi_alien_phase_harvest_project_archives_sanitize_risk: "A monitor preserved an impossible access pattern before the route collapsed."

 coi_alien_phase_disrupt_research_complex_fix: "Fix the Scientist in Place"
 coi_alien_phase_disrupt_research_complex_fix_desc: "Confirm the target scientist's active project, facility, routine, and emergency role."
 coi_alien_phase_disrupt_research_complex_fix_outcome: "The scientist and facility were fixed inside one operational window."
 coi_alien_phase_disrupt_research_complex_infiltrate: "Infiltrate the Safeguards"
 coi_alien_phase_disrupt_research_complex_infiltrate_desc: "Teach the facility's own safety systems to accept alien instructions as valid emergency behavior."
 coi_alien_phase_disrupt_research_complex_infiltrate_outcome: "The safeguards accepted the cell as part of their trusted environment."
 coi_alien_phase_disrupt_research_complex_overload: "Overload and Isolate"
 coi_alien_phase_disrupt_research_complex_overload_desc: "Damage the facility at the moment its lead expert is exposed and cut every safe route to the controls."
 coi_alien_phase_disrupt_research_complex_overload_outcome: "The complex failed and its scientist left the site unable to continue the work."
 coi_alien_phase_disrupt_research_complex_overload_risk: "Facility security isolated a cell during the overload and recovered traces of its tools."

 coi_alien_phase_extract_lead_scientist_contact: "Establish the Contact Pattern"
 coi_alien_phase_extract_lead_scientist_contact_desc: "Learn which signal, obligation, or manufactured emergency will move the scientist without an escort."
 coi_alien_phase_extract_lead_scientist_contact_outcome: "A believable reason to isolate the scientist was established."
 coi_alien_phase_extract_lead_scientist_substitute: "Substitute the Human Record"
 coi_alien_phase_extract_lead_scientist_substitute_desc: "Prepare records that make the subject appear present, transferred, or dead long enough to defeat the first search."
 coi_alien_phase_extract_lead_scientist_substitute_outcome: "The target's systems accepted a future in which the scientist was already elsewhere."
 coi_alien_phase_extract_lead_scientist_exfiltrate: "Exfiltrate Beyond Borders"
 coi_alien_phase_extract_lead_scientist_exfiltrate_desc: "Move the subject through a sealed chain of drone cells and into off-world custody."
 coi_alien_phase_extract_lead_scientist_exfiltrate_outcome: "The scientist vanished beyond the reach of human borders."
 coi_alien_phase_extract_lead_scientist_exfiltrate_risk: "The final transfer drew a human security response before every witness could be diverted."
