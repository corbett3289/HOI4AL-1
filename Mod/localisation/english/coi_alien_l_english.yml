 coi_alien_eir: "Eir"
 coi_alien_eir_desc: "First Voice of the Grey Consensus and final authority of the terrestrial expedition."
 coi_alien_vael: "Vael"
 coi_alien_vael_desc: "Theater commander of the Consensus ground host."
 coi_alien_thren: "Thren"
 coi_alien_thren_desc: "Fleet commander responsible for oceanic and transatmospheric operations."
 coi_alien_oru: "Oru"
 coi_alien_oru_desc: "Research coordinator for the expedition's unified Consensus Sciences program."
 coi_alien_saal: "Saal"
 coi_alien_saal_desc: "Administrative strategist maintaining the expedition's industrial and command cadence."

 coi_alien_xac_focus: "Grey Consensus: Judgment of Humanity"
 coi_alien_observe_divided_world: "Survey the Divided World"
 coi_alien_observe_divided_world_desc: "Before judgment, the Consensus will observe. Every extant human polity will be counted by its ruling ideological family, without weighting wealth, armies, population, or prestige."
 coi_alien_classify_human_order: "Classify the Human Order"
 coi_alien_classify_human_order_desc: "Humanity's most common form of rule reveals the pathology that has spread furthest. The Consensus will answer that pathology with its opposite, never with imitation. Exact ties resolve consistently in the order Democratic, Fascist, Communist, then Non-Aligned."

 coi_alien_federations_open_hand: "The Federation's Open Hand"
 coi_alien_federations_open_hand_desc: "Fascist dominance proves that hierarchy has become predation. The Consensus will break the supremacist states, liberate their subjects, and offer the survivors accession to a wider galactic federation."
 coi_alien_verdict_final_silence: "Verdict: Final Silence"
 coi_alien_verdict_final_silence_desc: "Democratic dominance has made existential policy another contest for approval, endlessly multiplying incompatible mandates. The Consensus judges this self-amplifying fragmentation incurable. Industrial humanity is to be extinguished."
 coi_alien_sovereignty_of_every_mind: "The Sovereignty of Every Mind"
 coi_alien_sovereignty_of_every_mind_desc: "Communist dominance has subordinated singular minds to centralized abstractions of class and party. The Consensus will dismantle those collectives and seed protected enclaves in which no institution may own a consciousness."
 coi_alien_one_world_mandate: "The One World Mandate"
 coi_alien_one_world_mandate_desc: "Non-Aligned dominance has preserved dynasties, juntas, and isolated sovereignties without a common direction. The Consensus will abolish non-alignment itself and compel Earth into one transparent planetary trusteeship."

 coi_alien_accession_protocols: "Prepare the Accession Protocols"
 coi_alien_accession_protocols_desc: "Liberation without a durable destination merely invites the next tyrant. Define the rights, obligations, and safeguards by which freed human polities may enter the galactic federation."
 coi_alien_calculate_last_dawn: "Calculate the Last Dawn"
 coi_alien_calculate_last_dawn_desc: "Extinction is not rage. It is an operation whose thresholds, exclusions, and terminal conditions must be computed before the first irreversible strike."
 coi_alien_seed_sovereign_enclaves: "Seed Sovereign Enclaves"
 coi_alien_seed_sovereign_enclaves_desc: "Map communities capable of surviving the collapse of centralized party rule, then prepare distributed sanctuaries that cannot be captured by a single human hierarchy."
 coi_alien_dissolve_old_borders: "Dissolve the Old Borders"
 coi_alien_dissolve_old_borders_desc: "Catalog the crowns, juntas, protectorates, and inherited frontiers that keep humanity politically uncommitted. None will survive the planetary mandate."

 coi_alien_world_census_tt: "Recalculates the human ideological census.\n\nCurrent existing human countries: §Y[?coi_alien_human_country_count|0]§!\nDemocratic: §C[?coi_alien_human_democratic_countries|0]§!\nFascist: §L[?coi_alien_human_fascism_countries|0]§!\nCommunist: §R[?coi_alien_human_communism_countries|0]§!\nNon-Aligned: §g[?coi_alien_human_non_aligned_countries|0]§!"
 coi_alien_requires_fascist_dominance_tt: "§YFascism§! must currently be humanity's most common ruling ideology."
 coi_alien_requires_democratic_dominance_tt: "§YDemocracy§! must currently be humanity's most common ruling ideology."
 coi_alien_requires_communist_dominance_tt: "§YCommunism§! must currently be humanity's most common ruling ideology."
 coi_alien_requires_non_aligned_dominance_tt: "§YNon-Alignment§! must currently be humanity's most common ruling ideology."
 coi_alien_adopt_federation_response_tt: "Locks the §YLiberation and Galactic Accession§! opposition doctrine. Later censuses cannot change it."
 coi_alien_adopt_annihilation_response_tt: "Locks the §YAnnihilation§! opposition doctrine. Later censuses cannot change it."
 coi_alien_adopt_singular_sovereignty_response_tt: "Locks the §YSingular Sovereignty§! opposition doctrine. Later censuses cannot change it."
 coi_alien_adopt_planetary_mandate_response_tt: "Locks the §YPlanetary Mandate§! opposition doctrine. Later censuses cannot change it."
 coi_alien_accession_protocols_ready_tt: "Establishes an expansion hook for liberation wars, protected integration, and future galactic-federation membership."
 coi_alien_annihilation_plan_ready_tt: "Establishes an expansion hook for extermination targeting, exclusions, and final-victory conditions."
 coi_alien_sovereign_enclaves_ready_tt: "Establishes an expansion hook for decentralized liberation, sanctuary states, and resistance to collectivist control."
 coi_alien_planetary_mandate_ready_tt: "Establishes an expansion hook for compulsory unification, trusteeship, and the abolition of non-alignment."
