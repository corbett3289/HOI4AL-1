l_english:
 coi_alien_human_sciences_category: "Human Sciences Directorate"
 coi_alien_human_sciences_category_desc: "The Consensus has accumulated §Y[?coi_alien_human_insights|0]§!/100 Human Insights and §Y[?coi_alien_tissue_samples|0]§!/10 viable tissue samples. Observation policy controls how quickly we learn, and how quickly humanity learns that it is being watched.\n\nInsight thresholds unlock cumulative models at §Y20§! (Surface), §Y50§! (Institutional), and §Y80§! (Predictive)."
 coi_alien_adopt_passive_observation: "Adopt Passive Observation"
 coi_alien_adopt_passive_observation_desc: "Study broadcasts, traffic, rituals, and institutions without deliberately touching the societies below."
 coi_alien_adopt_passive_observation_tt: "Observation produces §G1 Human Insight§! each month with the lowest incident risk. The policy can be changed again after §Y90 days§!."
 coi_alien_adopt_directed_infiltration: "Adopt Directed Infiltration"
 coi_alien_adopt_directed_infiltration_desc: "Insert controlled observers into institutions that reveal how human societies actually function."
 coi_alien_adopt_directed_infiltration_tt: "Observation produces §G2 Human Insights§! each month and improves infiltration operations. The policy can be changed again after §Y90 days§!."
 coi_alien_adopt_aggressive_sampling: "Adopt Aggressive Sampling"
 coi_alien_adopt_aggressive_sampling_desc: "Take specimens, manipulate encounters, and accept a measurable probability of discovery in exchange for rapid understanding."
 coi_alien_adopt_aggressive_sampling_tt: "Observation produces §G3 Human Insights§! each month, can recover tissue, and may raise awareness in studied countries. The policy can be changed again after §Y90 days§!."
 coi_alien_review_cultural_dossier: "Review Cultural Dossier"
 coi_alien_review_cultural_dossier_desc: "Open the Consensus model of [FROM.GetNameDef]'s institutions, symbols, taboos, and predictable collective responses."
 coi_alien_review_cultural_dossier_tt: "[FROM.GetNameDef] currently has dossier level §Y[?FROM.coi_alien_cultural_dossier|0]§!/4.\n\n§Y1§!: Surface Profile\n§Y2§!: Institutional Model\n§Y3§!: Cultural Fluency\n§Y4§!: Predictive Assimilation"
 coi_alien_create_facsimile_lena_marlow: "Grow Facsimile: Lena Marlow"
 coi_alien_create_facsimile_lena_marlow_desc: "Create a biologically human person whose engineered memories and cultural training support a native identity in [FROM.GetNameDef]."
 coi_alien_create_facsimile_daniel_voss: "Grow Facsimile: Daniel Voss"
 coi_alien_create_facsimile_daniel_voss_desc: "Create a second conditioned human person, built around a culturally fluent identity able to pass within [FROM.GetNameDef]."
 coi_alien_facsimile_lena_marlow: "Lena Marlow"
 coi_alien_facsimile_daniel_voss: "Daniel Voss"
 coi_alien_conditioned_human_facsimile: "Conditioned Human Facsimile"
 coi_alien_conditioned_human_facsimile_desc: "Biologically human and possessed of a complete inner life, this operative carries engineered memories, loyalties, and cultural reflexes. Conditioning makes the cover extraordinarily resilient; personhood makes the outcome impossible to reduce to machinery."

 coi_alien_observation_passive: "Passive Observation"
 coi_alien_observation_passive_desc: "The Consensus watches without touching. Progress is slower, but the observer leaves little for a suspicious society to find."
 coi_alien_observation_directed: "Directed Infiltration"
 coi_alien_observation_directed_desc: "Carefully bounded insertions turn broadcasts and census tables into working knowledge of living institutions."
 coi_alien_observation_aggressive: "Aggressive Sampling"
 coi_alien_observation_aggressive_desc: "The mission accepts contamination and discovery risk in return for tissue, behavioral data, and rapid cultural modeling."
 coi_alien_insight_surface_models: "Surface Models"
 coi_alien_insight_surface_models_desc: "Human gestures, schedules, uniforms, and routine expectations have become predictable enough to imitate."
 coi_alien_insight_institutional_models: "Institutional Models"
 coi_alien_insight_institutional_models_desc: "The Consensus can now anticipate how records, authority, and professional cultures interact behind public appearances."
 coi_alien_insight_predictive_models: "Predictive Human Models"
 coi_alien_insight_predictive_models_desc: "Human reactions can be modeled across competing institutions rather than guessed one individual at a time."
 coi_alien_conditioned_facsimile_program: "Conditioned Facsimile Program"
 coi_alien_conditioned_facsimile_program_desc: "Two additional field positions are reserved for cloned human persons trained to inhabit constructed terrestrial identities."
 coi_alien_clone_personhood_protocol: "Facsimile Personhood Protocol"
 coi_alien_clone_personhood_protocol_desc: "Conditioned origin does not erase moral agency. The Consensus formally recognizes its human operatives as persons whose consent and continuity matter."
 coi_alien_clone_reconditioning_cycle: "Identity Reconditioning Cycle"
 coi_alien_clone_reconditioning_cycle_desc: "Memory discrepancies are being forcibly compressed. Operational precision improves, while the Consensus absorbs the contradiction."
 coi_alien_postcontact_cultural_exchange: "Post-Contact Cultural Exchange"
 coi_alien_postcontact_cultural_exchange_desc: "The Galactic Federation doctrine replaces clandestine observation with guarded exchange and accession studies."
 coi_alien_postcontact_target_catalogue: "Post-Contact Target Catalogue"
 coi_alien_postcontact_target_catalogue_desc: "The Annihilation doctrine converts the human cultural model into a catalogue of vulnerabilities."
 coi_alien_postcontact_harmonization: "Post-Contact Harmonization"
 coi_alien_postcontact_harmonization_desc: "Singular Sovereignty studies humanity in order to fold its institutions into one directed whole."
 coi_alien_postcontact_imperial_census: "Post-Contact Imperial Census"
 coi_alien_postcontact_imperial_census_desc: "The Planetary Mandate classifies populations, elites, and obligations as subjects of a new planetary order."
 coi_alien_postcontact_direct_observation: "Direct Contact Observation"
 coi_alien_postcontact_direct_observation_desc: "Concealment is no longer possible. The Consensus now studies humanity through its response to undeniable contact."

 coi_alien_human_sciences.1.t: "An Observer Contaminates the Record"
 coi_alien_human_sciences.1.d: "A passive monitor responded to a human distress transmission before its restraint routines could intervene. The rescued crew remembers only a light and a voice, but our own data now includes a human reaction produced by us rather than merely observed."
 coi_alien_human_sciences.1.a: "Study the contamination as part of the system."
 coi_alien_human_sciences.1.b: "Scrub the exchange and reinforce restraint."
 coi_alien_human_sciences.2.t: "The Myth of the Pale Visitors"
 coi_alien_human_sciences.2.d: "Unrelated communities have begun telling remarkably similar stories about silent pale figures at the edge of sleep. None of the stories is accurate, yet together they reveal how humans compress uncertainty into culture."
 coi_alien_human_sciences.2.a: "Map how the story changes as it spreads."
 coi_alien_human_sciences.2.b: "Seed contradictions until it collapses into folklore."
 coi_alien_human_sciences.3.t: "A Scientist Finds the Pattern"
 coi_alien_human_sciences.3.d: "A terrestrial researcher has independently correlated atmospheric traces that our own analysts considered invisible. Silencing the work would preserve secrecy; following it may reveal which human methods deserve respect."
 coi_alien_human_sciences.3.a: "Let the reasoning run and learn from it."
 coi_alien_human_sciences.3.b: "Divert the publication before it converges."
 coi_alien_human_sciences.4.t: "The Returned Subject"
 coi_alien_human_sciences.4.d: "A sampled human survived the procedure and now exhibits memories our protocols were meant to suppress. The subject is frightened, observant, and unmistakably capable of interpreting what happened."
 coi_alien_human_sciences.4.a: "Retain the tissue record; release the subject."
 coi_alien_human_sciences.4.b: "End aggressive contact with this subject."
 coi_alien_human_sciences.5.t: "The Observer Takes Their Side"
 coi_alien_human_sciences.5.d: "One analyst has stopped describing a monitored community as a population model and begun arguing for its people by name. The attachment violates clean methodology, but its predictions have also become our most accurate."
 coi_alien_human_sciences.5.a: "Empathy is data the Consensus lacked."
 coi_alien_human_sciences.5.b: "Rotate the observer before attachment governs policy."
 coi_alien_human_sciences.6.t: "A Manufactured Memory Asks a Real Question"
 coi_alien_human_sciences.6.d: "A conditioned facsimile has identified contradictions between implanted childhood memories and the life now being lived. The operative does not dispute the mission. The question is whether a loyalty authored before awakening can ever constitute consent."
 coi_alien_human_sciences.6.a: "Recognize the person behind the constructed identity."
 coi_alien_human_sciences.6.b: "Stabilize the conditioning before it fractures."
 coi_alien_human_sciences.7.t: "A Human Life, Authored"
 coi_alien_human_sciences.7.d: "The new facsimile opens human eyes with language, habits, loyalties, and grief already present. The memories are engineered. The consciousness examining them is not. A terrestrial identity can now pass through institutions that no Grey or drone could inhabit—but the Consensus has also created a person who must live with knowing why."
 coi_alien_human_sciences.7.a: "Welcome the operative into the Consensus."
