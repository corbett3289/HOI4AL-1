l_english:
 coi_alien_crisis_start_mode: "Alien Crisis Start Mode"
 coi_alien_rule_inert: "Inert"
 coi_alien_rule_inert_desc: "The awareness framework is initialized, but the crisis remains dormant. No alien operations or landfall controls are exposed until debug tools or later integration content activates it."
 coi_alien_rule_hidden: "Hidden Presence"
 coi_alien_rule_hidden_desc: "The crisis runs from the shadows. Every country begins without classified knowledge and must discover the presence through alien activity, unusual reports, and investigation."
 coi_alien_rule_immediate_disclosure: "Immediate Disclosure"
 coi_alien_rule_immediate_disclosure_desc: "The crisis begins active and every existing country starts at least at Classified Confirmation and Official Acknowledgment. Material Proof is never downgraded. Landfall selection remains locked until later integration content or debug controls explicitly unlock it."
 coi_alien_rule_immediate_landfall: "Immediate Landfall"
 coi_alien_rule_immediate_landfall_desc: "The crisis begins publicly disclosed and landfall selection is immediately unlocked. A player must still choose the target; the setup will not silently select a country in multiplayer."

 coi_alien_awareness_category: "The Hidden Question"
 coi_alien_awareness_category_desc: "§YClassified Knowledge:§! [?coi_alien_awareness|0]/4\n§YPublic Awareness:§! [?coi_alien_public_awareness|0]/4\n§YPreparedness:§! [?coi_alien_preparedness|0]/4\n§YLeak Pressure:§! [?coi_alien_leak_pressure|0]\n\n§LKnowledge: Unaware / Anomalous Reports / Correlated Pattern / Classified Confirmation / Material Proof\nPublic: Unaware / Rumors / Credible Controversy / Official Acknowledgment / Undeniable Contact\nPreparedness: Unprepared / Quiet Monitoring / Contingency Planning / National Mobilization / Crisis War Footing§!"
 coi_alien_operations_category: "Extraterrestrial Field Operations"
 coi_alien_operations_category_desc: "Conduct covert operations against terrestrial powers. Survey data: §Y[?coi_alien_survey_data|0]§!. More intrusive missions produce more intelligence but can advance the target government's classified knowledge."
 coi_alien_landfall_control_category: "Landfall Control"
 coi_alien_landfall_control_category_desc: "At Classified Confirmation, prepare this nation as the single saved landfall target. Preparation grants XAC a special war goal, but does not transfer land or declare war."
 coi_alien_debug_category: "Alien Crisis Debug Controls"
 coi_alien_debug_category_desc: "Deterministic controls for awareness, disclosure, and landfall testing. Visible only in debug mode."

 coi_alien_investigate_anomalies: "Catalog the Impossible"
 coi_alien_investigate_anomalies_desc: "Correlate impossible radar returns, missing-time reports, mutilated livestock, and sensor failures across agencies. A pattern may emerge without the public ever seeing the file."
 coi_alien_form_investigation_cell: "Establish a Special Access Program"
 coi_alien_form_investigation_cell_desc: "Compartmentalize the evidence behind clearances that do not officially exist. A tiny directorate will possess classified confirmation and authority to pursue physical proof."
 coi_alien_mobilize_against_extraterrestrial_threat: "Prepare the Nation in Secret"
 coi_alien_mobilize_against_extraterrestrial_threat_desc: "Convert confirmed evidence into military continuity plans, civil-defense contingencies, and discreet countermeasures without revealing their true purpose."

 coi_alien_silent_survey: "Silent Survey: [FROM.GetNameDef]"
 coi_alien_silent_survey_desc: "Map [FROM.GetAdjective] communications, defenses, and population centers from beyond conventional sensor range. The mission has a §Y30%§! chance to raise the target's awareness by one stage."
 coi_alien_specimen_acquisition: "Specimen Acquisition: [FROM.GetNameDef]"
 coi_alien_specimen_acquisition_desc: "Acquire living samples after the target has begun noticing anomalies. This mission always raises the target's awareness by one stage and requires at least §Y1 Survey Data§!."
 coi_alien_infrastructure_probe: "Infrastructure Probe: [FROM.GetNameDef]"
 coi_alien_infrastructure_probe_desc: "Stress-test power, transport, and military networks under controlled conditions. This mission raises the target's awareness by two stages and requires at least §Y3 Survey Data§!."
 coi_alien_select_landfall_target: "Prepare Landfall in [FROM.GetNameDef]"
 coi_alien_select_landfall_target_desc: "Lock [FROM.GetNameDef] as the one global landfall target. Its government reaches at least Classified Confirmation and XAC receives a special war goal. Material Proof is preserved. No territory changes hands and war is not declared."
 coi_alien_prepare_landfall_here: "Prepare This Country for Landfall"
 coi_alien_prepare_landfall_here_desc: "Lock our country as the one global landfall target. Classified knowledge reaches at least Classified Confirmation and XAC receives a special war goal against us. Material Proof is preserved. No territory changes hands and war is not declared."

 coi_alien_awareness_rises_one_tt: "Classified government knowledge will increase by §Y1§! stage, never above Material Proof."
 coi_alien_awareness_becomes_confirmed_tt: "Classified knowledge will be raised to at least §RClassified Confirmation§!. Material Proof will not be reduced."
 coi_alien_awareness_becomes_mobilized_tt: "Classified knowledge will become §RMaterial Proof§!."
 coi_alien_silent_survey_effect_tt: "Gain §Y1 Survey Data§!. There is a §Y30%§! chance that [FROM.GetNameDef] gains one awareness stage."
 coi_alien_specimen_acquisition_effect_tt: "Gain §Y2 Survey Data§!. [FROM.GetNameDef] gains one awareness stage."
 coi_alien_infrastructure_probe_effect_tt: "Gain §Y3 Survey Data§!. [FROM.GetNameDef] gains two awareness stages."
 coi_alien_prepare_landfall_effect_tt: "The target government reaches at least §RClassified Confirmation§!, is saved as the unique landfall target, and XAC receives the §YExtraterrestrial Landfall§! war goal. Material Proof is preserved. §GNo states are transferred and no war is declared.§!"

 coi_alien_debug_activate_hidden: "DEBUG: Activate Hidden Crisis"
 coi_alien_debug_activate_hidden_desc: "Activate alien systems while preserving classified knowledge, public awareness, and preparedness. Missing values initialize safely."
 coi_alien_debug_activate_hidden_tt: "The hidden-presence framework becomes active."
 coi_alien_debug_immediate_disclosure: "DEBUG: Immediate Disclosure"
 coi_alien_debug_immediate_disclosure_desc: "Raise every existing country to at least Classified Confirmation and Official Acknowledgment, then activate the framework. Material Proof remains Material Proof."
 coi_alien_debug_immediate_disclosure_tt: "Every existing country reaches Classified Confirmation and Official Acknowledgment; Material Proof is preserved."
 coi_alien_debug_immediate_landfall: "DEBUG: Unlock Immediate Landfall"
 coi_alien_debug_immediate_landfall_desc: "Raise every existing country to at least Classified Confirmation and Official Acknowledgment, then unlock player landfall selection immediately. Material Proof is preserved."
 coi_alien_debug_immediate_landfall_tt: "Every existing country reaches Classified Confirmation and Official Acknowledgment, and landfall selection is unlocked."
 coi_alien_debug_set_awareness_0: "DEBUG: Knowledge 0 - Unaware"
 coi_alien_debug_set_awareness_0_desc: "Set this country's saved classified-knowledge value to exactly 0."
 coi_alien_debug_set_awareness_1: "DEBUG: Knowledge 1 - Anomalous Reports"
 coi_alien_debug_set_awareness_1_desc: "Set this country's saved classified-knowledge value to exactly 1."
 coi_alien_debug_set_awareness_2: "DEBUG: Knowledge 2 - Correlated Pattern"
 coi_alien_debug_set_awareness_2_desc: "Set this country's saved classified-knowledge value to exactly 2."
 coi_alien_debug_set_awareness_3: "DEBUG: Knowledge 3 - Classified Confirmation"
 coi_alien_debug_set_awareness_3_desc: "Set this country's saved classified-knowledge value to exactly 3."
 coi_alien_debug_set_awareness_4: "DEBUG: Knowledge 4 - Material Proof"
 coi_alien_debug_set_awareness_4_desc: "Set this country's saved classified-knowledge value to exactly 4. Preparedness is not changed."
 coi_alien_debug_prepare_landfall_here: "DEBUG: Prepare Landfall Here"
 coi_alien_debug_prepare_landfall_here_desc: "Activate the framework if needed, then lock this country as the unique landfall target."
 coi_alien_debug_reset_landfall: "DEBUG: Reset Landfall Target"
 coi_alien_debug_reset_landfall_desc: "Remove the XAC landfall war goal, clear the saved target, and unlock target selection again."
 coi_alien_debug_reset_landfall_tt: "The current landfall target and its XAC war goal will be cleared."

 coi_alien_landfall_wargoal: "Extraterrestrial Landfall"
 coi_alien_landfall_wargoal_desc: "A controlled war goal granted by the alien crisis landfall preparation flow."
 coi_alien_landfall_war_name: "$ORDER$$FIRST$ Landfall Against $SECOND$"
