 coi_alien_sp_self_healing_lattice_demonstrator: "Self-Healing Lattice Demonstrator"
 coi_alien_sp_self_healing_lattice_demonstrator_desc: "Build and repeatedly damage a phase lattice until autonomous restoration becomes predictable rather than accidental."
 coi_alien_sp_aperture_stabilization_experiment: "Aperture Stabilization Experiment"
 coi_alien_sp_aperture_stabilization_experiment_desc: "Hold a transfer aperture open under changing terrestrial conditions and prove that it can safely carry industrial power."
 coi_alien_sp_interorbital_sentinel_prototype: "Interorbital Sentinel Prototype"
 coi_alien_sp_interorbital_sentinel_prototype_desc: "Launch a compact autonomous craft, track a simulated ballistic target, and intercept it beyond the reach of terrestrial defenses."
 coi_alien_sp_controlled_atomic_decoherence: "Controlled Atomic Decoherence"
 coi_alien_sp_controlled_atomic_decoherence_desc: "Disrupt a fissile assembly without initiating it, preserving control across the full range of human weapon designs."
 coi_alien_sp_full_spectrum_human_culture_model: "Full-Spectrum Human Culture Model"
 coi_alien_sp_full_spectrum_human_culture_model_desc: "Reconcile languages, media, institutions, myths, and individual behavior into a model that can guide observation without assuming humanity is culturally uniform."
 coi_alien_sp_human_genome_atlas: "Human Genome Atlas Project"
 coi_alien_sp_human_genome_atlas_desc: "Combine acquired tissue records into a sufficiently complete model of human genetic and developmental variation."
 coi_alien_sp_viable_adult_clone: "Viable Adult Clone"
 coi_alien_sp_viable_adult_clone_desc: "Create a biologically stable adult human whose accelerated development preserves a functioning, independent mind."
 coi_alien_sp_molecular_airframe_printer: "Molecular Airframe Printer"
 coi_alien_sp_molecular_airframe_printer_desc: "Demonstrate a fabrication chamber capable of growing a complete operational aircraft from prepared feedstock."

