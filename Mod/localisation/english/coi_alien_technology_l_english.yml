 coi_alien_human_sciences: "Human Sciences"
 coi_alien_fabrication: "Expeditionary Fabrication"

 coi_alien_adaptive_metamaterials: "Adaptive Metamaterials"
 coi_alien_adaptive_metamaterials_desc: "Reconfigure matter at the lattice scale, allowing structural layers to alter their response before an impact has fully propagated."
 coi_alien_pale_horizon_phase_refit: "Pale Horizon Phase Refit"
 coi_alien_pale_horizon_phase_refit_desc: "Integrate adaptive phase layers throughout the Pale Horizon pattern, improving endurance and resistance to terrestrial weapons."
 coi_alien_terrestrial_composite_translation: "Terrestrial Composite Translation"
 coi_alien_terrestrial_composite_translation_desc: "Teach Consensus fabricators to substitute terrestrial feedstocks without losing the behavior encoded in an alien lattice."
 coi_alien_personal_phase_sheaths: "Personal Phase Sheaths"
 coi_alien_personal_phase_sheaths_desc: "Miniaturized field membranes deflect fragments, heat, and pressure before they reach a protected body."
 coi_alien_self_healing_phase_lattice: "Self-Healing Phase Lattice"
 coi_alien_self_healing_phase_lattice_desc: "A demonstrated lattice remembers its intended topology and rebuilds damaged bonds around the surviving pattern."
 coi_alien_adaptive_warform_shells: "Adaptive Warform Shells"
 coi_alien_adaptive_warform_shells_desc: "Layered combat shells alter rigidity, thermal response, and silhouette as rapidly as battlefield conditions change."

 coi_alien_inertial_field_theory: "Inertial Field Theory"
 coi_alien_inertial_field_theory_desc: "Refine local inertia into a controllable engineering variable instead of an unavoidable constraint."
 coi_alien_silent_current_field_refit: "Silent Current Field Refit"
 coi_alien_silent_current_field_refit_desc: "Retune the escort drive envelope for sharper acceleration and sustained operation beyond the anchorage's immediate support radius."
 coi_alien_tic_tac_fabrication: "Tic Tac Fabrication Lattice"
 coi_alien_tic_tac_fabrication_desc: "Standardize a seamless field-driven logistics craft that can cross Earth's oceans faster than terrestrial escorts can react."
 coi_alien_spacetime_aperture_geometry: "Spacetime Aperture Geometry"
 coi_alien_spacetime_aperture_geometry_desc: "Describe a stable throat through which energy and patterned matter can cross the gulf between Earth and the waiting Mothership."
 coi_alien_energy_gateway_synchronization: "Energy Gateway Synchronization"
 coi_alien_energy_gateway_synchronization_desc: "Synchronize a terrestrial aperture with Mothership emitters, allowing off-world production to reach an anchored gateway."
 coi_alien_stabilized_transit_network: "Stabilized Transit Network"
 coi_alien_stabilized_transit_network_desc: "Balance several apertures as one network so distant gateways can share load, correct drift, and survive interruptions."

 coi_alien_coherent_energy_control: "Coherent Energy Control"
 coi_alien_coherent_energy_control_desc: "Shape high-density energy across multiple coupled emitters without catastrophic phase drift."
 coi_alien_gleam_resonance_package: "Gleam Resonance Package"
 coi_alien_gleam_resonance_package_desc: "A synchronized emitter and targeting package gives the Gleam greater striking power without sacrificing its carrier-borne role."
 coi_alien_atomic_resonance_cartography: "Atomic Resonance Cartography"
 coi_alien_atomic_resonance_cartography_desc: "Map the signatures of fissile assemblies, reactor products, and delivery systems through atmosphere, terrain, and concealment."
 coi_alien_predictive_intercept_lattice: "Predictive Intercept Lattice"
 coi_alien_predictive_intercept_lattice_desc: "Fuse orbital tracks and probabilistic guidance models to place an interceptor in the path of a missile before human warning systems react."
 coi_alien_sentinel_reserve_fabrication: "Sentinel Reserve Fabrication"
 coi_alien_sentinel_reserve_fabrication_desc: "Encode a compact interorbital interceptor as a reproducible reserve pattern sustained through the gateway network."
 coi_alien_atomic_disruption_protocols: "Atomic Disruption Protocols"
 coi_alien_atomic_disruption_protocols_desc: "Apply controlled decoherence to corrupt warheads, confuse launch systems, and break nuclear attack chains without detonating their payloads."

 coi_alien_predictive_computation: "Predictive Computation"
 coi_alien_predictive_computation_desc: "Model probable battlespaces continuously and collapse thousands of tactical futures into a usable decision surface."
 coi_alien_needle_guidance_lattice: "Needle Guidance Lattice"
 coi_alien_needle_guidance_lattice_desc: "Distribute predictive fire control throughout the Needle's hull, improving interception, survivability, and sensor reach."
 coi_alien_multi_agent_infiltration_models: "Multi-Agent Infiltration Models"
 coi_alien_multi_agent_infiltration_models_desc: "Coordinate operatives, drones, and constructed identities as a single adaptive network rather than isolated assets."
 coi_alien_institutional_behavior_prediction: "Institutional Behavior Prediction"
 coi_alien_institutional_behavior_prediction_desc: "Model how ministries, militaries, corporations, and laboratories react when their routines are quietly disturbed."
 coi_alien_cascading_failure_models: "Cascading Failure Models"
 coi_alien_cascading_failure_models_desc: "Identify the smallest intervention capable of turning ordinary friction into systemic collapse."
 coi_alien_deep_substitution_architecture: "Deep Substitution Architecture"
 coi_alien_deep_substitution_architecture_desc: "Sustain identities across social, biometric, and bureaucratic systems until the inserted person becomes institutionally indistinguishable from the original."

 coi_alien_comparative_human_ethology: "Comparative Human Ethology"
 coi_alien_comparative_human_ethology_desc: "Study human societies as living systems whose rituals, fears, and loyalties vary sharply across nations and eras."
 coi_alien_mass_media_semiotics: "Mass-Media Semiotics"
 coi_alien_mass_media_semiotics_desc: "Decode the symbols and narrative patterns through which industrial societies decide what is credible, sacred, or dangerous."
 coi_alien_tissue_analysis: "Tissue Analysis"
 coi_alien_tissue_analysis_desc: "Catalog human cellular variation, development, disease, and repair from carefully acquired biological samples."
 coi_alien_human_genome_atlas: "Human Genome Atlas"
 coi_alien_human_genome_atlas_desc: "Convert scattered samples into a predictive map linking sequence, development, appearance, health, and inherited identity."
 coi_alien_accelerated_human_cloning: "Accelerated Human Cloning"
 coi_alien_accelerated_human_cloning_desc: "Grow a viable human body on an engineered timetable while preserving neurological development and long-term stability."
 coi_alien_conditioned_identity_imprinting: "Conditioned Identity Imprinting"
 coi_alien_conditioned_identity_imprinting_desc: "Give a cloned person coherent memories, loyalties, and cultural instincts while accepting that a living mind may eventually reinterpret them."

 coi_alien_expeditionary_pattern_libraries: "Expeditionary Pattern Libraries"
 coi_alien_expeditionary_pattern_libraries_desc: "Reduce ships, aircraft, tools, and replacement parts to verified fabrication patterns suited to an isolated expedition."
 coi_alien_molecular_feedstock_recovery: "Molecular Feedstock Recovery"
 coi_alien_molecular_feedstock_recovery_desc: "Disassemble captured matter into purified molecular stock and route it back into Consensus production loops."
 coi_alien_additive_airframe_printing: "Additive Airframe Printing"
 coi_alien_additive_airframe_printing_desc: "Translate the mature Needle and Gleam patterns into complete printed airframes, reducing both assembly work and strategic feedstock."
 coi_alien_continuous_airframe_lattice: "Continuous Airframe Lattice"
 coi_alien_continuous_airframe_lattice_desc: "A successful molecular printer grows hull, field channels, and control surfaces as one uninterrupted architecture."
 coi_alien_distributed_fabrication_logic: "Distributed Fabrication Logic"
 coi_alien_distributed_fabrication_logic_desc: "Divide production across gateways and local printers while preserving one validated pattern and shared material ledger."
 coi_alien_autonomous_fabrication_ecology: "Autonomous Fabrication Ecology"
 coi_alien_autonomous_fabrication_ecology_desc: "Link recovery, refinement, printing, inspection, and repair into a self-correcting industrial ecology."

 coi_alien_consensus_research_nexus: "Consensus Research Nexus"
 coi_alien_consensus_research_nexus_plural: "Consensus Research Nexuses"
