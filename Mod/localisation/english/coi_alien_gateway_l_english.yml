l_english:
 coi_alien_energy_gateway: "Energy Gateway"
 coi_alien_energy_gateway_desc: "A stabilized aperture coupling terrestrial infrastructure to the Mothership's fabrication lattice. Damage, occupation, or loss of Anchorage synchronization severs its off-world output."

 coi_alien_orbital_sentinel_equipment: "Interorbital Sentinel"
 coi_alien_orbital_sentinel_equipment_desc: "An autonomous craft held outside the terrestrial battlespace to identify and intercept nuclear launch vehicles. Sentinels exist as a strategic reserve rather than map units."
 coi_alien_orbital_sentinel_equipment_1: "Interorbital Sentinel"
 coi_alien_orbital_sentinel_equipment_1_short: "Sentinel"
 coi_alien_orbital_sentinel_equipment_1_desc: "A compact gravitic interceptor able to meet a ballistic weapon above the atmosphere and disrupt it before re-entry."

 coi_alien_atomic_disruption_degraded: "Atomic Disruption: Corrupted Launch Chain"
 coi_alien_atomic_disruption_degraded_desc: "Alien interference has corrupted nuclear materials, guidance archives, and launch validation procedures."
 coi_alien_atomic_disruption_critical: "Atomic Disruption: Systemic Decoherence"
 coi_alien_atomic_disruption_critical_desc: "The nuclear weapons complex is suffering engineered failures from warhead storage through launch control."

 coi_alien_gateway_category: "Off-World Fabrication Network"
 coi_alien_gateway_category_desc: "Build and synchronize Energy Gateways, allocate molecular fabrication capacity, maintain the Sentinel reserve, and extend formal orbital protection to selected partners. Current fabrication capacity: §H[?coi_alien_fabrication_capacity|0]§!/100. Monthly generation: §H[?coi_alien_gateway_monthly_capacity|0]§!."

 coi_alien_construct_energy_gateway: "Establish Energy Gateway in [FROM.GetName]"
 coi_alien_construct_energy_gateway_desc: "Spend 120 days opening a stable aperture between [FROM.GetName] and the Mothership. Only three gateways may be committed worldwide. A functional Tier I node supplies two off-map military factories and two fabrication capacity each month."
 coi_alien_upgrade_energy_gateway_tier_two: "Synchronize [FROM.GetName] Gateway"
 coi_alien_upgrade_energy_gateway_tier_two_desc: "Refine this aperture to Tier II over 90 days. Its cumulative output becomes four military factories, one civilian factory, and four fabrication capacity per month."
 coi_alien_upgrade_energy_gateway_tier_three: "Autonomize [FROM.GetName] Gateway"
 coi_alien_upgrade_energy_gateway_tier_three_desc: "Give this node an autonomous Tier III fabrication ecology over 120 days. Its cumulative output becomes six military factories, two civilian factories, one dockyard, and six fabrication capacity per month."
 coi_alien_gateway_cost_75pp_25cp: "£pol_power §H75§! £command_power §H25§!"
 coi_alien_gateway_cost_50pp_15cp: "£pol_power §H50§! £command_power §H15§!"
 coi_alien_gateway_cost_75pp_20cp: "£pol_power §H75§! £command_power §H20§!"

 coi_alien_print_needle_batch: "Print Needle Interceptor Batch"
 coi_alien_print_needle_batch_desc: "Reserve 20 fabrication capacity for a thirty-day molecular airframe run. Additive Airframe Printing produces 20 Needle Additive Pattern craft; Continuous Airframe Lattice instead produces 30 Needle Continuous Lattice craft."
 coi_alien_print_gleam_batch: "Print Gleam Strike-Craft Batch"
 coi_alien_print_gleam_batch_desc: "Reserve 20 fabrication capacity for a thirty-day molecular airframe run. Additive Airframe Printing produces 12 Gleam Additive Pattern craft; Continuous Airframe Lattice instead produces 18 Gleam Continuous Lattice craft."
 coi_alien_print_orbital_sentinel: "Print Interorbital Sentinel"
 coi_alien_print_orbital_sentinel_desc: "Predictive Intercept Lattice receives a finite three-craft field reserve. After Sentinel Reserve Fabrication, reserve 15 fabrication capacity for a forty-five-day replacement run. No more than twelve Sentinels may be maintained."

 coi_alien_offer_orbital_protection_accord: "Offer Orbital Protection to [FROM.GetName]"
 coi_alien_offer_orbital_protection_accord_desc: "Invite [FROM.GetName] into a formal Orbital Protection Accord. Nuclear missiles aimed at an Accord member can draw upon the Consensus gateway network and Sentinel reserve."
 coi_alien_revoke_orbital_protection_accord: "Revoke Orbital Protection from [FROM.GetName]"
 coi_alien_revoke_orbital_protection_accord_desc: "Remove [FROM.GetName] from the protected targeting lattice."

 coi_alien_atomic_disruption: "Atomic Disruption"
 coi_alien_atomic_disruption_desc: "Penetrate the target's nuclear command chain, corrupt warhead material and guidance archives, and seed cascading failures through its launch complexes."
 coi_alien_atomic_disruption_outcome_tt: "Consumes both Institutional Access and Research Access. The outcome can destroy a limited number of missiles or warheads, damage the selected rocket site, and reduce nuclear-raid reliability for 180–365 days. Failure sharply increases alien awareness."
 coi_alien_phase_atomic_disruption_map: "Map the Launch Chain"
 coi_alien_phase_atomic_disruption_map_desc: "Correlate command authentication, storage movements, telemetry, and launch-site readiness."
 coi_alien_phase_atomic_disruption_map_outcome: "The launch chain is rendered as a predictive dependency graph."
 coi_alien_phase_atomic_disruption_seed: "Seed Resonant Faults"
 coi_alien_phase_atomic_disruption_seed_desc: "Place microscopic field emitters and altered calibration records at vulnerable points in the nuclear complex."
 coi_alien_phase_atomic_disruption_seed_outcome: "The target's own maintenance cycle propagates the engineered defects."
 coi_alien_phase_atomic_disruption_collapse: "Collapse the Atomic Chain"
 coi_alien_phase_atomic_disruption_collapse_desc: "Trigger the embedded faults together and erase the access paths before investigators can reconstruct them."
 coi_alien_phase_atomic_disruption_collapse_outcome: "Warheads, missiles, and launch systems fail in mutually reinforcing patterns."
 coi_alien_phase_atomic_disruption_collapse_risk: "The synchronized failure may expose the non-human precision behind the attack."

 success_modifier_coi_alien_orbital_intercept_lattice: "Interorbital Sentinel Lattice"
 success_modifier_coi_alien_orbital_intercept_lattice_counterplay: "- Exhaust the protected target's Sentinel reserve or disable its Energy Gateways"
 success_modifier_coi_alien_atomic_disruption: "Atomic Disruption"
 success_modifier_coi_alien_atomic_disruption_improvement: "- Restore corrupted nuclear command and launch systems"
 coi_alien_orbital_interception_attempt_tt: "The protected target's §HInterorbital Sentinel Lattice§! engaged the incoming missile."

 coi_alien_gateway.1.t: "Orbital Protection Accord"
 coi_alien_gateway.1.desc: "The Grey Consensus offers to register our territory inside its orbital interception lattice. Its Energy Gateways and autonomous Sentinels would respond to nuclear missiles approaching our airspace, though the arrangement necessarily exposes strategic launch telemetry to alien systems."
 coi_alien_gateway.1.a: "Accept the protection protocol."
 coi_alien_gateway.1.b: "Our skies will not answer to them."
 coi_alien_gateway.2.t: "Protection Protocol Accepted"
 coi_alien_gateway.2.desc: "The target government has accepted. Its territory is now registered in the Orbital Protection Accord and may draw upon our Sentinel reserve."
 coi_alien_gateway.2.a: "Add their trajectories to the lattice."
 coi_alien_gateway.3.t: "Protection Protocol Refused"
 coi_alien_gateway.3.desc: "The target government refuses to expose its strategic airspace to the Sentinel lattice."
 coi_alien_gateway.3.a: "Leave their sky unbound."
 coi_alien_gateway.4.t: "Orbital Protection Withdrawn"
 coi_alien_gateway.4.desc: "The Grey Consensus has removed our territory from its orbital interception lattice. Its Sentinels will no longer answer launches directed at us."
 coi_alien_gateway.4.a: "We are outside the lattice."

 coi_alien_gateway.10.t: "Sentinel Lost During Interception"
 coi_alien_gateway.10.desc: "A nuclear missile entering protected space has failed to reach its target. The engagement destroyed one Interorbital Sentinel."
 coi_alien_gateway.10.a: "A finite craft for a city preserved."
 coi_alien_gateway.11.t: "Sentinel Interception"
 coi_alien_gateway.11.desc: "A nuclear missile entering protected space has failed to reach its target. The dispatched Sentinel returned to the strategic reserve."
 coi_alien_gateway.11.a: "The lattice held."
 coi_alien_gateway.12.t: "Sentinel Lost Against Thermonuclear Weapon"
 coi_alien_gateway.12.desc: "A thermonuclear missile entering protected space has failed to reach its target. The violent interception destroyed one Sentinel."
 coi_alien_gateway.12.a: "Replace it before the next launch."
 coi_alien_gateway.13.t: "Thermonuclear Interception"
 coi_alien_gateway.13.desc: "A thermonuclear missile entering protected space has failed to reach its target. The Sentinel survived the engagement."
 coi_alien_gateway.13.a: "Maintain the watch."
 coi_alien_gateway.14.t: "Sentinel Field Reserve"
 coi_alien_gateway.14.desc: "Predictive Intercept Lattice has synchronized three mothership-built Sentinels with the terrestrial gateway network. While at least one craft survives, the basic lattice reduces hostile nuclear-missile success by 35 percentage points. Sentinel Reserve Fabrication raises protection to 55 and permits replacements; Atomic Disruption Protocols raises it to 70."
 coi_alien_gateway.14.a: "Three finite interceptors stand watch."

 coi_alien_gateway.20.t: "Atomic Disruption Exposed"
 coi_alien_gateway.20.desc: "The planted resonators were found before activation. Nothing was destroyed, and investigators now possess evidence of a capability no terrestrial service should have."
 coi_alien_gateway.20.a: "Terminate the compromised access chain."
 coi_alien_gateway.21.t: "Atomic Disruption: Localized Failure"
 coi_alien_gateway.21.desc: "A launch complex and part of the target's missile inventory have been corrupted. Its nuclear command chain will remain unreliable for six months."
 coi_alien_gateway.21.a: "A useful fracture."
 coi_alien_gateway.22.t: "Atomic Disruption: Chain Collapse"
 coi_alien_gateway.22.desc: "Missiles, a warhead, and launch infrastructure failed together. The target's surviving nuclear forces now operate under deeply compromised validation procedures."
 coi_alien_gateway.22.a: "Their deterrent doubts itself."
 coi_alien_gateway.23.t: "Atomic Disruption: Systemic Decoherence"
 coi_alien_gateway.23.desc: "The entire seeded chain resonated at once. Multiple missiles, a warhead, and the selected launch complex were disabled, leaving a year-long pattern of inexplicable atomic failures."
 coi_alien_gateway.23.a: "The silence will persist."
