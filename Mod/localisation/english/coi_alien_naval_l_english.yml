l_english:
 coi_alien_mothership_anchorage: "Mothership Anchorage"
 coi_alien_mothership_anchorage_desc: "A hardened littoral interface between the Pale Horizon, its escorts, and terrestrial supply networks. While its operating network remains online, the Consensus can fabricate and sustain its oceanic and carrier-borne forces."

 coi_alien_mothership_anchorage_online: "Mothership Anchorage Online"
 coi_alien_mothership_anchorage_online_desc: "The anchorage is synchronized with off-world fabrication, command, and maintenance systems. Alien warship hulls and carrier craft can be produced only while this network remains online; once a Tic Tac convoy pattern has entered Earth's shared logistics ledger, the terrestrial production interface cannot retract it."

 coi_alien_tic_tac_transit_envelope: "Tic Tac Transit Envelope"
 coi_alien_tic_tac_transit_envelope_desc: "The Consensus subjects every craft recorded in its terrestrial convoy ledger to a common inertial-field transit envelope. This is a country-wide convoy profile: Earth's logistics systems cannot represent separate alien and conventional convoy performance."

 coi_alien_mothership_hull: "Mothership Hull"
 coi_alien_mothership_hull_desc: "A mobile command-carrier whose phase hangars and dense defensive lattice make it the center of an expeditionary ocean fleet."
 coi_alien_mothership: "Mothership"
 modifier_experience_gain_coi_alien_mothership_training_factor: "Mothership Training Experience Gain"
 modifier_experience_gain_coi_alien_mothership_mission_factor: "Mothership mission Experience Gain"
 modifier_experience_gain_coi_alien_mothership_combat_factor: "Mothership Combat Experience Gain"
 coi_alien_mothership_hull_1: "Pale Horizon Mothership"
 coi_alien_mothership_hull_1_short: "Mothership"
 coi_alien_mothership_hull_1_desc: "The terrestrial pattern of the Consensus mothership: immensely capable, prohibitively expensive, and inseparable from its anchorage network."

 coi_alien_escort_hull: "Alien Escort Hull"
 coi_alien_escort_hull_desc: "A compact screen vessel built around a gravitic drive, spectral sensors, and layered point defense."
 coi_alien_escort: "Alien Escort"
 modifier_experience_gain_coi_alien_escort_training_factor: "Alien Escort Training Experience Gain"
 modifier_experience_gain_coi_alien_escort_mission_factor: "Alien Escort mission Experience Gain"
 modifier_experience_gain_coi_alien_escort_combat_factor: "Alien Escort Combat Experience Gain"
 coi_alien_escort_hull_1: "Silent Current Escort"
 coi_alien_escort_hull_1_short: "Escort"
 coi_alien_escort_hull_1_desc: "A fast escort intended to keep conventional fleets, submarines, and aircraft away from the mothership."

 coi_alien_needle_equipment: "Needle Interceptor"
 coi_alien_needle_equipment_desc: "A carrier-capable interceptor optimized for violent acceleration, long-range interception, and defense of the mothership group."
 coi_alien_needle_equipment_1: "Needle"
 coi_alien_needle_equipment_1_short: "Needle"
 coi_alien_needle_equipment_1_desc: "The standard Consensus fleet-defense interceptor. Its narrow profile hides a disproportionately powerful sensor and weapons package."

 coi_alien_gleam_equipment: "Gleam Strike Craft"
 coi_alien_gleam_equipment_desc: "A carrier-capable attack craft for precision land strikes, anti-shipping attacks, and logistics interdiction."
 coi_alien_gleam_equipment_1: "Gleam"
 coi_alien_gleam_equipment_1_short: "Gleam"
 coi_alien_gleam_equipment_1_desc: "The Gleam delivers concentrated energy against surface targets before withdrawing behind Needle cover."

 coi_alien_gravitic_tide_drive: "Gravitic Tide Drive"
 coi_alien_gravitic_tide_drive_desc: "A field drive that treats the ocean as reaction mass only in the loosest sense, granting extraordinary speed at a steep fabrication cost."
 coi_alien_phase_hangar_matrix: "Phase Hangar Matrix"
 coi_alien_phase_hangar_matrix_desc: "Overlapping launch cells cycle small craft through protected preparation chambers and onto the flight line."
 coi_alien_lance_battery: "Coherent Lance Battery"
 coi_alien_lance_battery_desc: "A long-range directed-energy array capable of burning through the heaviest terrestrial armor."
 coi_alien_point_defense_matrix: "Point-Defense Matrix"
 coi_alien_point_defense_matrix_desc: "Distributed emitters and predictive fire control saturate the approaches to the ship."
 coi_alien_spectral_sensor_web: "Spectral Sensor Web"
 coi_alien_spectral_sensor_web_desc: "A fused sensor architecture that tracks surface, subsurface, and airborne contacts across an unnervingly broad spectrum."
 coi_alien_phase_lattice: "Phase Lattice"
 coi_alien_phase_lattice_desc: "Layered field geometry redistributes impacts and reinforces the physical hull, greatly increasing survivability."

 coi_alien_ship_drive: "Alien Drive"
 coi_alien_ship_hangar: "Alien Hangar"
 coi_alien_ship_lance: "Alien Main Battery"
 coi_alien_ship_point_defense: "Alien Point Defense"
 coi_alien_ship_sensor: "Alien Sensor"
 coi_alien_ship_lattice: "Alien Defensive Lattice"

 coi_alien_expeditionary_naval_architecture: "Expeditionary Naval Architecture"
 coi_alien_expeditionary_naval_architecture_desc: "Adapt off-world carrier, escort, and field-system designs to sustained operation in Earth's oceans."
 coi_alien_needle_interceptor_program: "Needle Interceptor Program"
 coi_alien_needle_interceptor_program_desc: "Configure the Needle for terrestrial atmosphere, carrier operations, and the defense of a geographically constrained expedition."
 coi_alien_gleam_strike_program: "Gleam Strike Program"
 coi_alien_gleam_strike_program_desc: "Adapt the Gleam's precision strike package for terrestrial armies, ports, supply networks, and naval targets."

 coi_alien_pale_horizon_design: "Pale Horizon Pattern"
 coi_alien_silent_current_escort_design: "Silent Current Escort Pattern"

 coi_alien_mothership_hull_2: "Pale Horizon Phase Refit"
 coi_alien_mothership_hull_2_short: "Phase-Refit Mothership"
 coi_alien_mothership_hull_2_desc: "A refitted Pale Horizon pattern with adaptive phase layers and a longer unsupported operating envelope."
 coi_alien_escort_hull_2: "Silent Current Field Refit"
 coi_alien_escort_hull_2_short: "Field-Refit Escort"
 coi_alien_escort_hull_2_desc: "A Silent Current pattern retuned for faster field transitions and extended screening operations."
 coi_alien_needle_equipment_2: "Needle Guidance Pattern"
 coi_alien_needle_equipment_2_short: "Needle Guidance"
 coi_alien_needle_equipment_2_desc: "A Needle whose predictive guidance lattice anticipates hostile maneuvers before conventional sensors resolve them."
 coi_alien_needle_equipment_3: "Needle Additive Pattern"
 coi_alien_needle_equipment_3_short: "Printed Needle"
 coi_alien_needle_equipment_3_desc: "A mature Needle pattern printed as a single airframe, reducing assembly work and strategic feedstock without compromising combat performance."
 coi_alien_needle_equipment_4: "Needle Continuous Lattice"
 coi_alien_needle_equipment_4_short: "Lattice Needle"
 coi_alien_needle_equipment_4_desc: "A continuously grown Needle whose hull, field channels, and control surfaces emerge as one low-waste structure."
 coi_alien_gleam_equipment_2: "Gleam Resonance Pattern"
 coi_alien_gleam_equipment_2_short: "Gleam Resonance"
 coi_alien_gleam_equipment_2_desc: "A Gleam refitted with coupled resonance emitters for heavier precision strikes against land and naval targets."
 coi_alien_gleam_equipment_3: "Gleam Additive Pattern"
 coi_alien_gleam_equipment_3_short: "Printed Gleam"
 coi_alien_gleam_equipment_3_desc: "A resonance-pattern Gleam printed around its emitter geometry, lowering assembly work and strategic feedstock."
 coi_alien_gleam_equipment_4: "Gleam Continuous Lattice"
 coi_alien_gleam_equipment_4_short: "Lattice Gleam"
 coi_alien_gleam_equipment_4_desc: "A continuously grown Gleam airframe that wastes almost nothing between molecular feedstock and operational craft."

 coi_alien_pale_horizon_phase_refit_design: "Pale Horizon Phase-Refit Pattern"
 coi_alien_silent_current_field_refit_design: "Silent Current Field-Refit Pattern"

 coi_alien_tic_tac_convoy: "Tic Tac Logistics Pattern"
 coi_alien_tic_tac_convoy_short: "Tic Tac"
 coi_alien_tic_tac_convoy_desc: "An autonomous field-propelled transport represented through XAC's country-specific variant of Earth's single convoy class. Its performance envelope necessarily applies to every convoy in the Consensus logistics pool."
